<!doctype html>
<html lang="en" dir="ltr" data-theme="dark" data-accent="teal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17171a" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <!-- Two plain files picked by media query: a <style> inside an SVG favicon stalls Chromium's page load. -->
    <link rel="icon" href="/favicon-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Hiwar</title>
    <script>
      (() => {
        const get = (key) => {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        };
        const saved = get("hiwar.locale");
        const locale =
          saved === "ar" || saved === "en"
            ? saved
            : navigator.languages.some((l) => l.toLowerCase().startsWith("ar"))
              ? "ar"
              : "en";
        const savedTheme = get("hiwar.theme");
        const theme =
          savedTheme === "light" ||
          (savedTheme === "system" &&
            !matchMedia("(prefers-color-scheme: dark)").matches)
            ? "light"
            : "dark";
        const html = document.documentElement;
        html.lang = locale;
        html.dir = locale === "ar" ? "rtl" : "ltr";
        html.dataset.theme = theme;
        html.dataset.accent = ["teal", "saffron", "blue", "violet", "rose", "lime"].includes(get("hiwar.accent")) ? get("hiwar.accent") : "teal";
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "light" ? "#fbfbfc" : "#17171a");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
